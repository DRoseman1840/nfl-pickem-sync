name: Automated NFL Schedule & Results Sync

on:
  schedule:
    - cron: '0 3,4,5 * * 5'
    - cron: '0 20,22 * * 0'
    - cron: '0 0,2,4,5 * * 1'
    - cron: '0 3,4,5 * * 2'
    - cron: '0 9 * * 2'
  workflow_dispatch: 

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install supabase requests

      - name: Create script file
        run: |
          cat << 'EOF' > run_sync.py
          import os
          import requests
          import time
          from supabase import create_client

          try:
              supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])
          except Exception as conn_err:
              print(f"❌ Supabase Connection Init Failed: {conn_err}")
              exit(1)

          print('🔄 Fetching live data from ESPN...')
          index_url = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'
          
          # 🖥️ Mimic a standard laptop browser header so ESPN doesn't block the cloud runner
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          response_json = None
          # 🔁 Retry Loop: Try up to 3 times if the connection drops or returns empty
          for attempt in range(3):
              try:
                  res = requests.get(index_url, headers=headers, timeout=15)
                  if res.status_code == 200:
                      response_json = res.json()
                      break
                  print(f"⚠️ Attempt {attempt+1}: Received status code {res.status_code}. Retrying...")
              except Exception as e:
                  print(f"⚠️ Attempt {attempt+1} failed: {e}")
              time.sleep(3)

          if not response_json:
              print("❌ Failed to reach ESPN Endpoint or parse JSON payload after 3 retries.")
              exit(1)
          
          week_number = response_json.get('week', {}).get('number', 1)
          events = response_json.get('events', [])
          print(f'🏈 Processing Week {week_number}. Found {len(events)} matchups.')

          for event in events:
              try:
                  game_id = event['id']
                  competition = event['competitions'][0]
                  game_time = competition['date']
                  
                  status_name = event['status']['type']['name']
                  status = 'SCHEDULED'
                  if 'STATUS_IN_PROGRESS' in status_name:
                      status = 'LIVE'
                  elif 'STATUS_FINAL' in status_name:
                      status = 'FINAL'
                      
                  teams = competition['competitors']
                  home_node = next(t for t in teams if t['homeAway'] == 'home')
                  away_node = next(t for t in teams if t['homeAway'] == 'away')
                  
                  home_team = home_node['team']['abbreviation']
                  home_logo = home_node['team'].get('logo', '')
                  
                  away_team = away_node['team']['abbreviation']
                  away_logo = away_node['team'].get('logo', '')
                  
                  winner = None
                  if status == 'FINAL':
                      if home_node.get('winner') is True:
                          winner = 'HOME'
                      elif away_node.get('winner') is True:
                          winner = 'AWAY'
                      else:
                          winner = 'TIE'

                  matchup_data = {
                      'id': game_id,
                      'week_number': int(week_number),
                      'home_team': home_team,
                      'away_team': away_team,
                      'home_logo': home_logo,
                      'away_logo': away_logo,
                      'game_time': game_time,
                      'status': status,
                      'winner': winner
                  }
                  
                  supabase.table('matchups').upsert(matchup_data).execute()
                  print(f"✅ Synced: {away_team} @ {home_team}")
              except Exception as match_err:
                  print(f"⚠️ Skipping individual match item due to format error: {match_err}")
                  continue
                  
          print('✅ Database syncing updates completed successfully!')
          EOF

      - name: Run the Sync Script
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python run_sync.py
